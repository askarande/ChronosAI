name: Build Chronos AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Generate Gradle Wrapper
        run: |
          cd ChronosApp
          gradle wrapper

      - name: Grant Execute Permission
        run: chmod +x ChronosApp/gradlew

      - name: Build Debug APK
        run: |
          cd ChronosApp
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChronosAI-debug
          path: ChronosApp/app/build/outputs/apk/debug/app-debug.apk