name: Build Chronos AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # FIX: Installs the missing Gradle wrapper files directly on the server
      - name: Setup Gradle Wrapper
        run: |
          cd ChronosApp
          gradle wrapper --gradle-version 8.2

      - name: Grant Execute Permission for Gradle
        run: chmod +x ChronosApp/gradlew

      - name: Build Debug APK
        run: |
          cd ChronosApp
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChronosAI-debug
          path: ChronosApp/app/build/outputs/apk/debug/app-debug.apk
